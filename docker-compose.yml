version: '3.8'

services:
  # Base de Datos: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: rentflow_postgres
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password123
      POSTGRES_DB: rentflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Almacenamiento de objetos: MinIO (Simulador de AWS S3)
  minio:
    image: minio/minio:latest
    container_name: rentflow_minio
    restart: always
    ports:
      - "9000:9000" # API de S3
      - "9001:9001" # Consola Web de Administración
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local